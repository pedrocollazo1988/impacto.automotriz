<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="MANDOS Y CONTROL">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#dbe6f3" stroke-width="1"/>
    </pattern>
    <pattern id="grid-lg" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#c6d7ea" stroke-width="1.2"/>
    </pattern>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fb"/><stop offset="1" stop-color="#d3e0ef"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa0ff"/><stop offset="1" stop-color="#0b5fd0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0 0l7 3-7 3z" fill="#4a6b96"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f4f7fb"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#grid-lg)"/>
  <rect x="14" y="14" width="1172" height="772" fill="none" stroke="#c9d8ea" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="40" y="58" font-size="19" font-weight="700" fill="#0b2a5b" letter-spacing="2">MANDOS Y CONTROL</text>
    <text x="40" y="80" font-size="12" fill="#4a6b96" letter-spacing="1.4">07 · ACELERADOR, DISPLAY Y ENCENDIDO</text>
    <text x="1160" y="58" font-size="12" fill="#4a6b96" text-anchor="end" letter-spacing="1.4">KVITOVA · DDS-OD</text>
    <text x="1160" y="80" font-size="11" fill="#8fa6c2" text-anchor="end">LÁMINA 07</text>
  </g>
  <line x1="40" y1="94" x2="1160" y2="94" stroke="#c9d8ea" stroke-width="1.5"/>
  <!-- puño acelerador -->
  <g id="parte-01">
    <rect x="150" y="300" width="250" height="60" rx="30" fill="url(#steel)" stroke="#0b2a5b" stroke-width="3"/>
    <g stroke="#4a6b96" stroke-width="2">
      <path d="M186 306v48"/><path d="M212 306v48"/><path d="M238 306v48"/><path d="M264 306v48"/><path d="M290 306v48"/><path d="M316 306v48"/><path d="M342 306v48"/>
    </g>
    <circle cx="368" cy="330" r="22" fill="#0a84ff" stroke="#0b2a5b" stroke-width="2.6"/>
    <text x="368" y="336" font-size="10" fill="#fff" text-anchor="middle" font-family="ui-monospace, monospace">REV</text>
    <text x="275" y="400" font-size="11.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">PUÑO · 3 VELOCIDADES</text>
  </g>
  <!-- display -->
  <g id="parte-02">
    <rect x="470" y="250" width="210" height="150" rx="18" fill="#0b2a5b"/>
    <rect x="490" y="272" width="170" height="86" rx="9" fill="#0f2c52" stroke="#0a84ff" stroke-width="2"/>
    <text x="575" y="312" font-size="24" font-weight="700" fill="#0a84ff" text-anchor="middle" font-family="ui-monospace, monospace">72.0</text>
    <text x="575" y="336" font-size="10" fill="#8fc2ff" text-anchor="middle" font-family="ui-monospace, monospace">VOLT · ODO</text>
    <circle cx="528" cy="382" r="8" fill="#1f7a3f"/><circle cx="575" cy="382" r="8" fill="#4a6b96"/><circle cx="622" cy="382" r="8" fill="#4a6b96"/>
    <text x="575" y="430" font-size="11.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">DISPLAY LCD</text>
  </g>
  <!-- llave de encendido -->
  <g id="parte-03">
    <circle cx="840" cy="310" r="52" fill="url(#steel)" stroke="#0b2a5b" stroke-width="3"/>
    <circle cx="840" cy="310" r="30" fill="#f4f7fb" stroke="#0b2a5b" stroke-width="2.4"/>
    <path d="M840 310l24 -18" stroke="#0b2a5b" stroke-width="5" stroke-linecap="round"/>
    <text x="840" y="392" font-size="11" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">2 LLAVES</text>
  </g>
  <!-- manillar -->
  <g id="parte-04">
    <path d="M120 470q240 -110 480 0" fill="none" stroke="#0b2a5b" stroke-width="11" stroke-linecap="round"/>
    <circle cx="120" cy="470" r="15" fill="#4a6b96"/><circle cx="600" cy="470" r="15" fill="#4a6b96"/>
    <text x="360" y="530" font-size="11.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">MANILLAR</text>
  </g>
  <!-- interruptores -->
  <g id="parte-05">
    <rect x="700" y="450" width="130" height="60" rx="12" fill="#f4f7fb" stroke="#0b2a5b" stroke-width="2.6"/>
    <circle cx="735" cy="480" r="12" fill="#1f7a3f"/><circle cx="765" cy="480" r="12" fill="#4a6b96"/><circle cx="795" cy="480" r="12" fill="#b91c1c"/>
    <text x="765" y="540" font-size="10.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">LUCES · BOCINA</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M275 330 L210 210" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="275" cy="330" r="3.2" fill="#4a6b96"/>
    <circle cx="210" cy="210" r="13" fill="#0b2a5b"/>
    <text x="210" y="214.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="232" y="214.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="start">Puño acelerador</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M575 325 L640 180" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="575" cy="325" r="3.2" fill="#4a6b96"/>
    <circle cx="640" cy="180" r="13" fill="#0b2a5b"/>
    <text x="640" y="184.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="618" y="184.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="end">Display digital</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M840 310 L1010 240" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="840" cy="310" r="3.2" fill="#4a6b96"/>
    <circle cx="1010" cy="240" r="13" fill="#0b2a5b"/>
    <text x="1010" y="244.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="988" y="244.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="end">Switch de encendido</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M360 400 L300 620" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="360" cy="400" r="3.2" fill="#4a6b96"/>
    <circle cx="300" cy="620" r="13" fill="#0b2a5b"/>
    <text x="300" y="624.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="322" y="624.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="start">Manillar</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M765 480 L900 620" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="765" cy="480" r="3.2" fill="#4a6b96"/>
    <circle cx="900" cy="620" r="13" fill="#0b2a5b"/>
    <text x="900" y="624.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="878" y="624.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="end">Interruptores</text>
  </g>

</svg>

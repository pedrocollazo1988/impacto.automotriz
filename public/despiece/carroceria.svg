<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="CHASIS Y CARROCERÍA">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#dbe6f3" stroke-width="1"/>
    </pattern>
    <pattern id="grid-lg" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#c6d7ea" stroke-width="1.2"/>
    </pattern>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fb"/><stop offset="1" stop-color="#d3e0ef"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa0ff"/><stop offset="1" stop-color="#0b5fd0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0 0l7 3-7 3z" fill="#4a6b96"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f4f7fb"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#grid-lg)"/>
  <rect x="14" y="14" width="1172" height="772" fill="none" stroke="#c9d8ea" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="40" y="58" font-size="19" font-weight="700" fill="#0b2a5b" letter-spacing="2">CHASIS Y CARROCERÍA</text>
    <text x="40" y="80" font-size="12" fill="#4a6b96" letter-spacing="1.4">06 · TOLVA, ASIENTOS Y CABINA</text>
    <text x="1160" y="58" font-size="12" fill="#4a6b96" text-anchor="end" letter-spacing="1.4">KVITOVA · DDS-OD</text>
    <text x="1160" y="80" font-size="11" fill="#8fa6c2" text-anchor="end">LÁMINA 06</text>
  </g>
  <line x1="40" y1="94" x2="1160" y2="94" stroke="#c9d8ea" stroke-width="1.5"/>
  <!-- tolva -->
  <g id="parte-01">
    <path d="M300 250h600l-46 300H346z" fill="url(#steel)" stroke="#0b2a5b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M360 300h480M380 370h440M400 440h400" stroke="#4a6b96" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M300 250l46 300M900 250l-46 300" stroke="#0b2a5b" stroke-width="2.4"/>
    <path d="M262 250h676" stroke="#0b2a5b" stroke-width="9" stroke-linecap="round"/>
    <text x="600" y="600" font-size="12" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">TOLVA 1600 × 1100 mm · VOLTEO MANUAL</text>
  </g>
  <!-- asientos y escalera -->
  <g id="parte-02">
    <rect x="380" y="120" width="230" height="24" rx="9" fill="#0b2a5b"/>
    <rect x="380" y="120" width="24" height="86" rx="9" fill="#0b2a5b"/>
    <rect x="586" y="120" width="24" height="86" rx="9" fill="#0b2a5b"/>
    <path d="M760 560v110M800 560v110M840 560v110M880 560v110" stroke="#0b2a5b" stroke-width="6" stroke-linecap="round"/>
    <path d="M746 570h148" stroke="#0b2a5b" stroke-width="5"/>
    <text x="470" y="176" font-size="11" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">BANCA</text>
  </g>
  <!-- cabina -->
  <g id="parte-03">
    <path d="M300 250V120a24 24 0 0124-24h152a24 24 0 0124 24v130" fill="none" stroke="#4a6b96" stroke-width="3.4" stroke-dasharray="9 6"/>
    <path d="M326 250V140h150v110" fill="#e8f1fb" stroke="#0b2a5b" stroke-width="2.4" opacity=".9"/>
    <text x="401" y="200" font-size="10.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">PARABRISAS</text>
  </g>
  <!-- chasis -->
  <g id="parte-04">
    <path d="M200 560h800" stroke="#0b2a5b" stroke-width="12" stroke-linecap="round"/>
    <path d="M240 620h720" stroke="#4a6b96" stroke-width="5" stroke-dasharray="10 7"/>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M600 400 L1010 330" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="600" cy="400" r="3.2" fill="#4a6b96"/>
    <circle cx="1010" cy="330" r="13" fill="#0b2a5b"/>
    <text x="1010" y="334.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="988" y="334.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="end">Cama / tolva de carga</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M495 132 L300 120" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="495" cy="132" r="3.2" fill="#4a6b96"/>
    <circle cx="300" cy="120" r="13" fill="#0b2a5b"/>
    <text x="300" y="124.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="322" y="124.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="start">Asientos y escalera</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M401 200 L700 130" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="401" cy="200" r="3.2" fill="#4a6b96"/>
    <circle cx="700" cy="130" r="13" fill="#0b2a5b"/>
    <text x="700" y="134.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="678" y="134.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="end">Parabrisas y techo</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M700 560 L700 700" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="700" cy="560" r="3.2" fill="#4a6b96"/>
    <circle cx="700" cy="700" r="13" fill="#0b2a5b"/>
    <text x="700" y="704.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="678" y="704.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="end">Chasis</text>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="SUSPENSIÓN">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#dbe6f3" stroke-width="1"/>
    </pattern>
    <pattern id="grid-lg" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#c6d7ea" stroke-width="1.2"/>
    </pattern>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fb"/><stop offset="1" stop-color="#d3e0ef"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa0ff"/><stop offset="1" stop-color="#0b5fd0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0 0l7 3-7 3z" fill="#4a6b96"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f4f7fb"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#grid-lg)"/>
  <rect x="14" y="14" width="1172" height="772" fill="none" stroke="#c9d8ea" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="40" y="58" font-size="19" font-weight="700" fill="#0b2a5b" letter-spacing="2">SUSPENSIÓN</text>
    <text x="40" y="80" font-size="12" fill="#4a6b96" letter-spacing="1.4">04 · HORQUILLA, BALLESTAS Y AMORTIGUADORES</text>
    <text x="1160" y="58" font-size="12" fill="#4a6b96" text-anchor="end" letter-spacing="1.4">KVITOVA · DDS-OD</text>
    <text x="1160" y="80" font-size="11" fill="#8fa6c2" text-anchor="end">LÁMINA 04</text>
  </g>
  <line x1="40" y1="94" x2="1160" y2="94" stroke="#c9d8ea" stroke-width="1.5"/><g id="sheet-body" transform="translate(-186.2 -105.6) scale(1.383)">
  <!-- barras telescópicas -->
  <g id="parte-01">
    <rect x="196" y="196" width="34" height="330" rx="15" fill="url(#steel)" stroke="#0b2a5b" stroke-width="3"/>
    <rect x="300" y="196" width="34" height="330" rx="15" fill="url(#steel)" stroke="#0b2a5b" stroke-width="3"/>
    <rect x="178" y="180" width="70" height="34" rx="9" fill="#0b2a5b"/>
    <rect x="282" y="180" width="70" height="34" rx="9" fill="#0b2a5b"/>
    <path d="M230 300h54" stroke="#4a6b96" stroke-width="2.4" stroke-dasharray="6 4"/>
    <path d="M213 470v40M317 470v40" stroke="#0b2a5b" stroke-width="4"/>
    <text x="265" y="560" font-size="11.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">HORQUILLA HIDRÁULICA</text>
  </g>
  <!-- ballestas -->
  <g id="parte-02">
    <path d="M470 470q170 -46 340 0" fill="none" stroke="#0b2a5b" stroke-width="7" stroke-linecap="round"/><path d="M470 487q170 -54 340 0" fill="none" stroke="#0b2a5b" stroke-width="6" stroke-linecap="round"/><path d="M470 504q170 -62 340 0" fill="none" stroke="#0b2a5b" stroke-width="5" stroke-linecap="round"/><path d="M470 521q170 -70 340 0" fill="none" stroke="#0b2a5b" stroke-width="4" stroke-linecap="round"/>
    <path d="M500 470v-34M780 470v-34" stroke="#4a6b96" stroke-width="3"/>
    <text x="640" y="580" font-size="11.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">PAQUETE DE BALLESTAS · 500–800 kg</text>
  </g>
  <!-- amortiguadores -->
  <g id="parte-03">
    <rect x="880" y="250" width="34" height="150" rx="12" fill="#f4f7fb" stroke="#0b2a5b" stroke-width="3"/>
    <path d="M897 400v96" stroke="#0b2a5b" stroke-width="12" stroke-linecap="round"/>
    <path d="M897 400v96" stroke="#c9d8ea" stroke-width="4"/>
    <circle cx="897" cy="240" r="13" fill="#0b2a5b"/><circle cx="897" cy="506" r="13" fill="#0b2a5b"/>
    <text x="897" y="560" font-size="11.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">RESORTE HIDRÁULICO</text>
  </g>
  <!-- bastidor de referencia -->
  <g id="parte-04" opacity=".5">
    <path d="M120 640h960" stroke="#4a6b96" stroke-width="3" stroke-dasharray="12 8"/>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M213 260 L178.0 160.0" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="213" cy="260" r="3.2" fill="#4a6b96"/>
    <circle cx="178.0" cy="160.0" r="13" fill="#0b2a5b"/>
    <text x="178.0" y="164.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="200.0" y="164.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="start">Barras telescópicas</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M640 440 L700 340" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="640" cy="440" r="3.2" fill="#4a6b96"/>
    <circle cx="700" cy="340" r="13" fill="#0b2a5b"/>
    <text x="700" y="344.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="678" y="344.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="end">Ballestas traseras</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M897 330 L958.9 220.0" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="897" cy="330" r="3.2" fill="#4a6b96"/>
    <circle cx="958.9" cy="220.0" r="13" fill="#0b2a5b"/>
    <text x="958.9" y="224.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="936.9" y="224.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="end">Amortiguadores</text>
  </g>
  <text x="40" y="770" font-size="11.5" fill="#4a6b96" font-family="ui-monospace, monospace">CARGA ÚTIL DE DISEÑO: 500–800 kg · DOBLE CRISTO DELANTERO</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="SISTEMA DE PROPULSIÓN">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#dbe6f3" stroke-width="1"/>
    </pattern>
    <pattern id="grid-lg" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#c6d7ea" stroke-width="1.2"/>
    </pattern>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fb"/><stop offset="1" stop-color="#d3e0ef"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa0ff"/><stop offset="1" stop-color="#0b5fd0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0 0l7 3-7 3z" fill="#4a6b96"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f4f7fb"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#grid-lg)"/>
  <rect x="14" y="14" width="1172" height="772" fill="none" stroke="#c9d8ea" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="40" y="58" font-size="19" font-weight="700" fill="#0b2a5b" letter-spacing="2">SISTEMA DE PROPULSIÓN</text>
    <text x="40" y="80" font-size="12" fill="#4a6b96" letter-spacing="1.4">01 · MOTOR, DIFERENCIAL Y SELECTOR</text>
    <text x="1160" y="58" font-size="12" fill="#4a6b96" text-anchor="end" letter-spacing="1.4">KVITOVA · DDS-OD</text>
    <text x="1160" y="80" font-size="11" fill="#8fa6c2" text-anchor="end">LÁMINA 01</text>
  </g>
  <line x1="40" y1="94" x2="1160" y2="94" stroke="#c9d8ea" stroke-width="1.5"/><g id="sheet-body" transform="translate(-10.4 -196.4) scale(1.45)">
  <!-- eje de explosión -->
  <g opacity=".4">
    <path d="M120 470H1080" stroke="#4a6b96" stroke-width="1.6" stroke-dasharray="10 8"/>
  </g>

  <!-- motor -->
  <g id="parte-01">
    <rect x="150" y="392" width="176" height="152" rx="26" fill="url(#steel)" stroke="#0b2a5b" stroke-width="3"/>
    <g stroke="#0b2a5b" stroke-width="2.2" fill="none">
      <path d="M176 418h124M176 446h124M176 474h124M176 502h124"/>
    </g>
    <circle cx="238" cy="468" r="40" fill="#f4f7fb" stroke="#0b2a5b" stroke-width="2.5"/>
    <circle cx="238" cy="468" r="14" fill="#0a84ff"/>
    <path d="M326 468h58" stroke="#0b2a5b" stroke-width="9" stroke-linecap="round"/>
    <text x="238" y="580" font-size="12" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">MOTOR 72V · 1200W</text>
  </g>

  <!-- diferencial -->
  <g id="parte-02">
    <ellipse cx="580" cy="468" rx="112" ry="92" fill="url(#steel)" stroke="#0b2a5b" stroke-width="3"/>
    <ellipse cx="580" cy="468" rx="68" ry="55" fill="none" stroke="#0b2a5b" stroke-width="2"/>
    <circle cx="580" cy="468" r="26" fill="#f4f7fb" stroke="#0b2a5b" stroke-width="2.5"/>
    <g stroke="#0b2a5b" stroke-width="2"><path d="M580 442v-13M580 507v13M554 468h-13M619 468h13"/></g>
    <text x="580" y="600" font-size="12" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">DIFERENCIAL · REDUCTORA</text>
  </g>


  <!-- selector de fuerza -->
  <g id="parte-03">
    <rect x="420" y="250" width="126" height="60" rx="12" fill="#f4f7fb" stroke="#0b2a5b" stroke-width="2.6"/>
    <path d="M452 310v-32" stroke="#0b2a5b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="452" cy="272" r="11" fill="#0a84ff" stroke="#0b2a5b" stroke-width="2"/>
    <path d="M484 268h44M484 292h44" stroke="#4a6b96" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="484" y="344" font-size="11" fill="#4a6b96" font-family="ui-monospace, monospace">ALTA / BAJA</text>
  </g>

  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M238 468 L150 300" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="238" cy="468" r="3.2" fill="#4a6b96"/>
    <circle cx="150" cy="300" r="13" fill="#0b2a5b"/>
    <text x="150" y="304.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="172" y="304.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="start">Motor sin escobillas</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M580 468 L640 690" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="580" cy="468" r="3.2" fill="#4a6b96"/>
    <circle cx="640" cy="690" r="13" fill="#0b2a5b"/>
    <text x="640" y="694.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="618" y="694.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="end">Eje con diferencial</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M452 280 L340 190" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="452" cy="280" r="3.2" fill="#4a6b96"/>
    <circle cx="340" cy="190" r="13" fill="#0b2a5b"/>
    <text x="340" y="194.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="362" y="194.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="start">Selector de fuerza</text>
  </g>
  <text x="40" y="762" font-size="11.5" fill="#4a6b96" font-family="ui-monospace, monospace">ACOPLE DIRECTO AL DIFERENCIAL · CAJA REDUCTORA DE DOBLE FUERZA</text>
</g>
</svg>

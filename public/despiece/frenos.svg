<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="SISTEMA DE FRENOS">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#dbe6f3" stroke-width="1"/>
    </pattern>
    <pattern id="grid-lg" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#c6d7ea" stroke-width="1.2"/>
    </pattern>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fb"/><stop offset="1" stop-color="#d3e0ef"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa0ff"/><stop offset="1" stop-color="#0b5fd0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0 0l7 3-7 3z" fill="#4a6b96"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f4f7fb"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#grid-lg)"/>
  <rect x="14" y="14" width="1172" height="772" fill="none" stroke="#c9d8ea" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="40" y="58" font-size="19" font-weight="700" fill="#0b2a5b" letter-spacing="2">SISTEMA DE FRENOS</text>
    <text x="40" y="80" font-size="12" fill="#4a6b96" letter-spacing="1.4">05 · TAMBOR, VARILLA Y ESTACIONAMIENTO</text>
    <text x="1160" y="58" font-size="12" fill="#4a6b96" text-anchor="end" letter-spacing="1.4">KVITOVA · DDS-OD</text>
    <text x="1160" y="80" font-size="11" fill="#8fa6c2" text-anchor="end">LÁMINA 05</text>
  </g>
  <line x1="40" y1="94" x2="1160" y2="94" stroke="#c9d8ea" stroke-width="1.5"/><g id="sheet-body" transform="translate(-240.8 -171.3) scale(1.406)">
  <!-- tambor trasero -->
  <g id="parte-01">
    <circle cx="360" cy="420" r="146" fill="url(#steel)" stroke="#0b2a5b" stroke-width="4"/>
    <circle cx="360" cy="420" r="104" fill="none" stroke="#0b2a5b" stroke-width="2.4"/>
    <path d="M433.53910524340097 493.53910524340097L463.237590053236 523.237590053236" stroke="#4a6b96" stroke-width="3"/><path d="M286.46089475659903 493.53910524340097L256.7624099467641 523.237590053236" stroke="#4a6b96" stroke-width="3"/><path d="M286.46089475659903 346.46089475659903L256.762409946764 316.7624099467641" stroke="#4a6b96" stroke-width="3"/><path d="M433.5391052434009 346.46089475659903L463.2375900532359 316.762409946764" stroke="#4a6b96" stroke-width="3"/>
    <circle cx="360" cy="420" r="40" fill="#f4f7fb" stroke="#0b2a5b" stroke-width="3"/>
    <path d="M320 400q40 -22 80 0" fill="none" stroke="#0a84ff" stroke-width="10" stroke-linecap="round"/>
    <path d="M320 440q40 22 80 0" fill="none" stroke="#0a84ff" stroke-width="10" stroke-linecap="round"/>
    <text x="360" y="620" font-size="12" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">TAMBOR · ZAPATAS</text>
  </g>
  <!-- pedal y varilla -->
  <g id="parte-02">
    <rect x="640" y="470" width="150" height="34" rx="8" fill="url(#steel)" stroke="#0b2a5b" stroke-width="3"/>
    <path d="M640 487H520" stroke="#0b2a5b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="512" cy="487" r="12" fill="#0b2a5b"/>
    <path d="M790 487h140" stroke="#4a6b96" stroke-width="4" stroke-dasharray="8 5"/>
    <rect x="930" y="452" width="52" height="70" rx="9" fill="#f4f7fb" stroke="#0b2a5b" stroke-width="2.6"/>
    <text x="956" y="540" font-size="10.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">SENSOR</text>
  </g>
  <!-- estacionamiento -->
  <g id="parte-03">
    <rect x="640" y="250" width="26" height="120" rx="10" fill="#0b2a5b"/>
    <circle cx="653" cy="238" r="17" fill="#0a84ff" stroke="#0b2a5b" stroke-width="2.5"/>
    <path d="M666 370h84" stroke="#0b2a5b" stroke-width="5" stroke-linecap="round"/>
    <text x="708" y="404" font-size="11" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">BLOQUEO</text>
  </g>
  <!-- detalle de zapatas -->
  <g transform="translate(880,150)">
    <rect x="0" y="0" width="240" height="230" rx="10" fill="#fff" stroke="#c9d8ea" stroke-width="2"/>
    <text x="16" y="28" font-size="11.5" fill="#4a6b96" font-family="ui-monospace, monospace">DETALLE · ZAPATA</text>
    <path d="M40 150q80 -74 160 0" fill="none" stroke="#0b2a5b" stroke-width="22" stroke-linecap="round"/>
    <path d="M40 150q80 74 160 0" fill="none" stroke="#4a6b96" stroke-width="14" stroke-linecap="round"/>
    <circle cx="120" cy="150" r="16" fill="#0a84ff"/>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M360 420 L250 190" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="360" cy="420" r="3.2" fill="#4a6b96"/>
    <circle cx="250" cy="190" r="13" fill="#0b2a5b"/>
    <text x="250" y="194.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="272" y="194.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="start">Zapatas / bandas</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M715 487 L700 640" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="715" cy="487" r="3.2" fill="#4a6b96"/>
    <circle cx="700" cy="640" r="13" fill="#0b2a5b"/>
    <text x="700" y="644.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="678" y="644.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="end">Pedal y varilla</text>
  </g>
  
  <g class="callout" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M653 300 L520 210" stroke="#4a6b96" stroke-width="1.1" stroke-dasharray="4 3"/>
    <circle cx="653" cy="300" r="3.2" fill="#4a6b96"/>
    <circle cx="520" cy="210" r="13" fill="#0b2a5b"/>
    <text x="520" y="214.6" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="542" y="214.4" font-size="12.5" fill="#0b2a5b"
          text-anchor="start">Freno de estacionamiento</text>
  </g>
  <text x="40" y="770" font-size="11.5" fill="#4a6b96" font-family="ui-monospace, monospace">ACCIONAMIENTO MECÁNICO POR VARILLA · CORTE ELÉCTRICO AL FRENAR</text>
</g>
</svg>

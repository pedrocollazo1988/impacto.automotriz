    <text x="40" y="80" font-size="12" fill="#4a6b96" letter-spacing="1.4">02 · CONTROLADOR, BATERÍAS Y CARGA</text>
    <text x="1160" y="58" font-size="12" fill="#4a6b96" text-anchor="end" letter-spacing="1.4">KVITOVA · DDS-OD</text>
    <text x="1160" y="80" font-size="11" fill="#8fa6c2" text-anchor="end">LÁMINA 02</text>
  </g>
  <line x1="40" y1="94" x2="1160" y2="94" stroke="#c9d8ea" stroke-width="1.5"/>

      <rect x="634" y="444" width="80" height="16" rx="3" fill="#0b2a5b" opacity=".8"/>
      <circle cx="650" cy="478" r="7" fill="#b91c1c"/><circle cx="698" cy="478" r="7" fill="#0b2a5b"/>
      <text x="674" y="516" font-size="10.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">12V 58Ah</text></g><g><rect x="750" y="432" width="108" height="104" rx="9" fill="url(#steel)" stroke="#0b2a5b" stroke-width="2.6"/>
      <rect x="764" y="444" width="80" height="16" rx="3" fill="#0b2a5b" opacity=".8"/>
      <circle cx="780" cy="478" r="7" fill="#b91c1c"/><circle cx="828" cy="478" r="7" fill="#0b2a5b"/>
      <text x="804" y="516" font-size="10.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">12V 58Ah</text></g><g><rect x="880" y="432" width="108" height="104" rx="9" fill="url(#steel)" stroke="#0b2a5b" stroke-width="2.6"/>
      <rect x="894" y="444" width="80" height="16" rx="3" fill="#0b2a5b" opacity=".8"/>
      <circle cx="910" cy="478" r="7" fill="#b91c1c"/><circle cx="958" cy="478" r="7" fill="#0b2a5b"/>
      <text x="934" y="516" font-size="10.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">12V 58Ah</text></g>
    <path d="M620 268h368" stroke="#4a6b96" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="804" y="256" font-size="11.5" fill="#4a6b96" text-anchor="middle" font-family="ui-monospace, monospace">SERIE · 72V TOTAL</text>
  </g>
